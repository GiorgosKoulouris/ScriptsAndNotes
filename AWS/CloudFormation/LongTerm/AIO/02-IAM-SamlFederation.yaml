AWSTemplateFormatVersion: "2010-09-09"
Description: "Creates a SAML Identity Provider and basic roles across all AWS Org child accounts"

Parameters:
  OrgIdentifier:
    Type: String
    Default: CUST-ENV
    Description: Identifier used for naming resources.
  RetentionPolicy:
    Type: String
    AllowedValues: [Delete, Retain]
    Default: Delete
    Description: Retention policy for stack resources
  IdpNameKeycloak:
    Type: String
    Default: TCOP-Keycloak
    Description: "The name of the SAML Identity Provider"
  SAMLMetadataDocumentKeycloak:
    Type: String
    Description: "The full SAML Metadata XML document for Keycloak"
  VaultUserArnForTrust:
    Type: String
    Default: arn:aws:iam::891377077020:user/TCOP-SVC-DCKR-HVLT
    
Resources:
  SAMLIdentityProviderKeycloak:
    Type: "AWS::IAM::SAMLProvider"
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      Name: !Ref IdpNameKeycloak
      SamlMetadataDocument: !Ref SAMLMetadataDocumentKeycloak

  AdminRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      RoleName: !Sub "${OrgIdentifier}-Administrator"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated: 
              - !Sub "arn:aws:iam::${AWS::AccountId}:saml-provider/${IdpNameKeycloak}"
          Action: sts:AssumeRoleWithSAML
          Condition:
            StringEquals:
              "SAML:aud": "https://signin.aws.amazon.com/saml"
        - Effect: Allow
          Principal:
            Federated: !Sub "arn:aws:iam::${AWS::AccountId}:saml-provider/${IdpNameKeycloak}"
          Action: sts:TagSession
          Condition:
            StringLike:
              aws:RequestTag/Email: "*"
        - Effect: Allow
          Principal:
            AWS: !Ref VaultUserArnForTrust
          Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess"
      Policies:
      - PolicyName: !Sub "${OrgIdentifier}-Administrator-Policy"
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: "Deny"
            Action:
            - "sso:*"
            - "identitystore:*"
            - "organizations:*"
            - "billing:*"
            - "payment-method:*"
            - "sts:AssumeRole"
            - "sts:SetDefaultPolicyVersion"
            Resource: "*"

  PowerUserRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      RoleName: !Sub "${OrgIdentifier}-PowerUser"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated:
              - !Sub "arn:aws:iam::${AWS::AccountId}:saml-provider/${IdpNameKeycloak}"
          Action: sts:AssumeRoleWithSAML
          Condition:
            StringEquals:
              "SAML:aud": "https://signin.aws.amazon.com/saml"
        - Effect: Allow
          Principal:
            Federated: !Sub "arn:aws:iam::${AWS::AccountId}:saml-provider/${IdpNameKeycloak}"
          Action: sts:TagSession
          Condition:
            StringLike:
              aws:RequestTag/Email: "*"
        - Effect: Allow
          Principal:
            AWS: !Ref VaultUserArnForTrust
          Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"
      Policies:
      - PolicyName: !Sub "${OrgIdentifier}-PowerUser-Policy"
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: "Deny"
            Action:
            - "sso:*"
            - "identitystore:*"
            - "organizations:*"
            - "billing:*"
            - "payment-method:*"
            - "sts:AssumeRole"
            - "sts:SetDefaultPolicyVersion"
            Resource: "*"

  ReadOnlyRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      RoleName: !Sub "${OrgIdentifier}-ReadOnly"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated: 
              - !Sub "arn:aws:iam::${AWS::AccountId}:saml-provider/${IdpNameKeycloak}"
          Action: sts:AssumeRoleWithSAML
          Condition:
            StringEquals:
              "SAML:aud": "https://signin.aws.amazon.com/saml"
        - Effect: Allow
          Principal:
            Federated: !Sub "arn:aws:iam::${AWS::AccountId}:saml-provider/${IdpNameKeycloak}"
          Action: sts:TagSession
          Condition:
            StringLike:
              aws:RequestTag/Email: "*"
        - Effect: Allow
          Principal:
            AWS: !Ref VaultUserArnForTrust
          Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess"
      Policies:
      - PolicyName: !Sub "${OrgIdentifier}-ReadOnly-Policy"
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: "Deny"
            Action:
            - "sso:*"
            - "identitystore:*"
            - "organizations:*"
            - "billing:*"
            - "payment-method:*"
            - "sts:AssumeRole"
            - "sts:SetDefaultPolicyVersion"
            - "support:*"
            - "kms:CreateKey"
            - "kms:ScheduleKeyDeletion"
            Resource: "*"

Outputs:
  AdminRole:
    Description: "ARN of the Admin Role"
    Value: !Ref AdminRole
  ReadOnlyRole:
    Description: "ARN of the ReadOnly Role"
    Value: !Ref ReadOnlyRole
  PowerUserRole:
    Description: "ARN of the PowerUser Role"
    Value: !Ref PowerUserRole
