AWSTemplateFormatVersion: '2010-09-09'
Description: Provision basic roles for service operations

Parameters:
  OrgIdentifier:
    Type: String
    Default: CUST-ENV
    Description: Identifier used for naming resources.
  TcopElasticUserARN:
    Type: String
    Default: arn:aws:iam::891377077020:user/TCOP-SVC-DCKR-STUT
    Description: ARN of the user to allow to assume the role for elastic discovery
  TcopVmOpsUserARN:
    Type: String
    Default: arn:aws:iam::891377077020:user/TCOP-SVC-DCKR-CLOP
    Description: ARN of the user to allow to assume the role for VM Operations
  TcopGrafanaUserARN:
    Type: String
    Default: arn:aws:iam::891377077020:user/TCOP-SVC-DCKR-GRFN
    Description: ARN of the user to allow to assume the role for monitoring
  TcopAuditUserARN:
    Type: String
    Default: arn:aws:iam::891377077020:user/TCOP-SVC-DCKR-PWLR
    Description: ARN of the user to allow to assume the role for audit
  TcopAuditProwlerOrg:
    Type: String
    Default: 6ff4aed0-bd3b-4a52-8ff2-92307ac113fc
    Description: Organisation ID of the prowler instance
  RetentionPolicy:
    Type: String
    AllowedValues: [ Delete, Retain ]
    Default: Delete
    Description: Retention policy for stack resources

Resources:
  EC2SsmRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      RoleName: !Sub "${OrgIdentifier}-EC2-SsmManagedRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: !Sub "${AWS::AccountId}"
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonSSMManagedEC2InstanceDefaultPolicy

  EC2SsmRoleProfile:
    Type: AWS::IAM::InstanceProfile
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      InstanceProfileName: !Sub "${OrgIdentifier}-EC2-SsmManagedProfile"
      Roles:
      - !Ref EC2SsmRole

  VpcFlowLogsRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      RoleName: !Sub "${OrgIdentifier}-SVC-VpcFlowLogsRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Principal:
            Service: vpc-flow-logs.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: !Sub "${AWS::AccountId}"
      Policies:
      - PolicyName: !Sub "${OrgIdentifier}-SVC-VpcFlowLogsRole-Policy"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            - logs:DescribeLogGroups
            - logs:DescribeLogStreams
            Resource: "*"

  MonitoringRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      RoleName: !Sub "${OrgIdentifier}-SVC-MonitoringRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Principal:
            AWS:
            - !Ref TcopGrafanaUserARN
            - !Ref TcopElasticUserARN
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
      - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess
      - arn:aws:iam::aws:policy/AmazonVPCReadOnlyAccess

  BackupExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      RoleName: !Sub "${OrgIdentifier}-SVC-AwsBackup"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - backup.amazonaws.com
            - ssm.amazonaws.com
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:SourceAccount: !Sub "${AWS::AccountId}"
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup

  VmOpsRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      RoleName: !Sub "${OrgIdentifier}-SVC-VmOpsRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Ref TcopVmOpsUserARN
          Action: sts:AssumeRole
      Policies:
      - PolicyName: Allow-VmActions
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Effect: Allow
            Sid: AllowBackupActions
            Action:
            - backup:StartBackupJob
            - backup:ListRecoveryPointsByBackupVault
            - backup:DescribeRecoveryPoint
            - backup:DeleteRecoveryPoint
            - ec2:DescribeImages
            - ec2:DeregisterImage
            - ec2:DescribeSnapshots
            - ec2:DeleteSnapshot
            Resource: "*"
          - Effect: Allow
            Sid: AllowPassRole
            Action: iam:PassRole
            Resource: !GetAtt BackupExecutionRole.Arn
          - Effect: Allow
            Sid: AllowVmActions
            Action:
            - ec2:StartInstances
            - ec2:StopInstances
            - ec2:RebootInstances
            Resource: "*"

  AuditRole:
    Type: AWS::IAM::Role
    DeletionPolicy: !Ref RetentionPolicy
    Properties:
      RoleName: !Sub "${OrgIdentifier}-SVC-AuditRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: Allow
          Principal:
            AWS: !Ref TcopAuditUserARN
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              "sts:ExternalId": !Sub ${TcopAuditProwlerOrg}
      ManagedPolicyArns:
      - "arn:aws:iam::aws:policy/SecurityAudit"
      - "arn:aws:iam::aws:policy/job-function/ViewOnlyAccess"
      Policies:
      - PolicyName: Allow-ProwlerScan
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Sid: AllowMoreReadOnly
            Effect: Allow
            Action:
            - "account:Get*"
            - "appstream:Describe*"
            - "appstream:List*"
            - "backup:List*"
            - "bedrock:List*"
            - "bedrock:Get*"
            - "cloudtrail:GetInsightSelectors"
            - "codeartifact:List*"
            - "codebuild:BatchGet*"
            - "codebuild:ListReportGroups"
            - "cognito-idp:GetUserPoolMfaConfig"
            - "dlm:Get*"
            - "drs:Describe*"
            - "ds:Get*"
            - "ds:Describe*"
            - "ds:List*"
            - "dynamodb:GetResourcePolicy"
            - "ec2:GetEbsEncryptionByDefault"
            - "ec2:GetSnapshotBlockPublicAccessState"
            - "ec2:GetInstanceMetadataDefaults"
            - "ecr:Describe*"
            - "ecr:GetRegistryScanningConfiguration"
            - "elasticfilesystem:DescribeBackupPolicy"
            - "glue:GetConnections"
            - "glue:GetSecurityConfiguration*"
            - "glue:SearchTables"
            - "lambda:GetFunction*"
            - "logs:FilterLogEvents"
            - "lightsail:GetRelationalDatabases"
            - "macie2:GetMacieSession"
            - "macie2:GetAutomatedDiscoveryConfiguration"
            - "s3:GetAccountPublicAccessBlock"
            - "shield:DescribeProtection"
            - "shield:GetSubscriptionState"
            - "securityhub:BatchImportFindings"
            - "securityhub:GetFindings"
            - "servicecatalog:Describe*"
            - "servicecatalog:List*"
            - "ssm:GetDocument"
            - "ssm-incidents:List*"
            - "states:ListTagsForResource"
            - "support:Describe*"
            - "tag:GetTagKeys"
            - "wellarchitected:List*"
            Resource: "*"
          - Sid: AllowAPIGatewayReadOnly
            Effect: Allow
            Action:
            - "apigateway:GET"
            Resource:
            - "arn:*:apigateway:*::/restapis/*"
            - "arn:*:apigateway:*::/apis/*"

Outputs:
  EC2SsmRoleARN:
    Description: "ARN of the IAM role for the default EC2 instance profile"
    Value: !GetAtt EC2SsmRole.Arn
  FlowLogsRoleARN:
    Description: "ARN of the IAM role for Flow Logs"
    Value: !GetAtt VpcFlowLogsRole.Arn
  BackupExecutionRoleARN:
    Description: "ARN of the IAM role for AWS Backup"
    Value: !GetAtt BackupExecutionRole.Arn
  VmOpsRoleARN:
    Description: "ARN of the IAM role for VM Operations tool"
    Value: !GetAtt VmOpsRole.Arn
  MonitoringRoleARN:
    Description: "ARN of the IAM role for Monitoring"
    Value: !GetAtt MonitoringRole.Arn
